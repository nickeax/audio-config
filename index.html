<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./app/style/index.css">
  <script src="./app/index.js" type="module" defer></script>
  <title>Studio Configuration</title>
</head>

<body>
  <div class="container appBorder panelShadow topRadius">
    <header>
      <div class="sectionHeader fadedText lightBackground">Studio Equipment Wrangler</div>
    </header>

    <nav class="appBorder panelShadow topRadius">
      <div id="studioSelectionHeader" class="sectionHeader ">Studio Selection</div>
      <div class="panel lightText" id="studioSelection"></div>
    </nav>

    <main id="studioEquipment" class="studioEquipment appBorder panelShadow topRadius">
      <div class="sectionHeader">Current Configuration</div>
      <div class="panel lightText" id="currentConfiguration"></div>
    </main>

    <div class="editConfiguration appBorder panelShadow topRadius">
      <div id="operations" class="sectionHeader">Operations</div>
    </div>

    <div class="options appBorder panelShadow topRadius">
      <div class="sectionHeader">Options</div>
    </div>
  </div>
  <footer>
    <p>&copy;
      <script>document.writeln(new Date().getUTCFullYear())</script> Studio Equipment Wrangler
    </p>
  </footer>
</body>

</html>
