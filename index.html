<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./app/style/index.css">
  <script src="./app/index.js" type="module" defer></script>
  <title>Studio Configuration</title>
</head>

<body class="backgroundMainDark">
  <div class="container">
    <header class="backgroundDarkest">
      <div class="sectionHeader fadedText padding-5">Studio Equipment Wrangler</div>
    </header>

    <nav class="appBorder panelShadow topRadius backgroundMainPrimary padding-9">
      <div id="studioSelectionHeader" class="sectionHeader textMainLight mb-9">Studio Selection</div>
      <div class="panel lightText" id="studioSelection"></div>
    </nav>

    <main id="studioEquipment" class="appBorder panelShadow topRadius backgroundMainSecondary padding-9">
      <div class="sectionHeader textMainLight mb-9">Current Configuration</div>
      <div class="panel backgroundMainSecondary textMainLight" id="currentConfiguration"></div>
    </main>

    <div class="editConfiguration appBorder panelShadow topRadius padding-9">
      <div id="operations" class="sectionHeader textMainLight mb-9">Operations</div>
      <div class="panel lightText" id="operationsPanel"></div>
    </div>

    <div class="options appBorder panelShadow topRadius backgroundMainPrimary padding-9">
      <div class="sectionHeader textMainLight mb-9">Options</div>
    </div>

  </div>
  <footer class="backgroundDarkest textMainLight padding-9">
    <p>&copy;
      <script>document.writeln(new Date().getUTCFullYear())</script> Studio Equipment Wrangler
    </p>
  </footer>
</body>

</html>
