<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./app/style/index.css">
  <script src="./app/index.js" type="module" defer></script>
  <title>Studio Configuration</title>
</head>

<body class="backgroundMainDark">
  <div class="container">
    <header class="backgroundDarkest">
      <div class="sectionHeader textMainPrimary padding-5 sectionHeaderBorder">Studio Equipment Wrangler</div>
    </header>

    <div class="spacerLeft"></div>

    <nav class="appBorder panelShadow topRadius backgroundMainPrimary">
      <div id="studioSelectionHeader"
        class="sectionHeader textMainLight darkerTintColour mb-9 topRadius sectionHeaderBorder">Studios
      </div>
      <div class="panel textMainLight padding-5" id="studioSelection"></div>
    </nav>

    <div class="options appBorder panelShadow topRadius backgroundMainPrimary">
      <div class="sectionHeader textMainLight darkerTintColour mb-9 topRadius sectionHeaderBorder">Options</div>
      <div class="panel textMainLight padding-5" id="optionsPanel">Hello</div>
    </div>

    <main id="studioEquipment" class="appBorder panelShadow topRadius backgroundMainSecondary">
      <div class="sectionHeader textMainLight darkerTintColour mb-9 topRadius sectionHeaderBorder">Current Configuration
      </div>
      <div class="panel backgroundMainSecondary textMainLight padding-5" id="currentConfiguration"></div>
    </main>

    <div class="editConfiguration appBorder panelShadow backgroundMainPrimary topRadius">
      <div id="operations" class="sectionHeader textMainLight darkerTintColour mb-9 topRadius sectionHeaderBorder">
        Operations</div>
      <div class="panel  textMainLight padding-5" id="operationsPanel">Hello</div>
    </div>

    <div class="spacerRight"></div>

    <footer class="backgroundDarkest textFaded padding-9">
      <p>&copy;
        <script>document.writeln(new Date().getUTCFullYear())</script> Studio Equipment Wrangler
      </p>
    </footer>
  </div>
</body>

</html>
